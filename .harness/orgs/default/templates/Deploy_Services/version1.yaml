template:
  name: Deploy Services
  identifier: Deploy_Services
  versionLabel: version1
  type: Pipeline
  orgIdentifier: default
  tags: {}
  spec:
    variables:
      - name: serviceName
        type: String
        description: "Service directory name (REQUIRED)"
        required: true
        value: <+input>.allowedValues(auth-service,user-service,catalog-service,cart-service,order-service,payment-service,inventory-service,shipping-service,search-service)
      - name: artifactId
        type: String
        description: "Maven artifactId (usually same as serviceName)"
        required: true
        value: <+input>
    properties:
      ci:
        codebase:
          connectorRef: account.Github_OAuth_1766587643054
          repoName: Mendelev/Digital-Marketplace
          build: <+input>
    stages:
      - stage:
          name: Build
          identifier: Build
          description: ""
          type: CI
          spec:
            cloneCodebase: true
            caching:
              enabled: true
              override: true
            buildIntelligence:
              enabled: true
            platform:
              os: Linux
              arch: Amd64
            runtime:
              type: Cloud
              spec: {}
            execution:
              steps:
                - step:
                    type: Run
                    name: Build_Service
                    identifier: Build_Service
                    spec:
                      connectorRef: account.harnessImage
                      image: maven:3.9-eclipse-temurin-21
                      shell: Sh
                      command: |
                        echo "Building <+pipeline.variables.serviceName>..."
                        cd <+pipeline.variables.serviceName> && \
                          mvn -B clean package -DskipTests
                        
                        echo "Build completed successfully"
                        ls -lh target/*.jar
