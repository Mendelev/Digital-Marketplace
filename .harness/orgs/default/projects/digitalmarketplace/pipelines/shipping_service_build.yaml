pipeline:
  name: shipping_service_build
  identifier: shipping_service_build
  projectIdentifier: digitalmarketplace
  orgIdentifier: default
  tags: {}
  variables:
    - name: serviceName
      type: String
      description: Service directory name
      required: true
      value: shipping-service
    - name: artifactId
      type: String
      description: Maven artifactId from pom.xml
      required: true
      value: shipping-service
    - name: jfrogBaseUrl
      type: String
      description: JFrog Artifactory base URL (without repo name)
      required: true
      value: https://trialq6tyqg.jfrog.io/artifactory
    - name: jfrogRepoName
      type: String
      description: JFrog repository name for snapshots
      required: true
      value: libs-snapshot-local
    - name: dynamicVersion
      type: String
      description: Dynamic version with build number
      required: false
      value: ""
      default: ""
  properties:
    ci:
      codebase:
        connectorRef: account.Github_OAuth_1766587643054
        repoName: Mendelev/Digital-Marketplace
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              imageSpec:
                imageName: ubuntu-latest
          execution:
            steps:
              - step:
                  name: Generate_Maven_Settings
                  identifier: Generate_Maven_Settings
                  template:
                    templateRef: org.Generate_Maven_Settings
                    versionLabel: version1
              - step:
                  type: Snyk
                  name: Snyk_1
                  identifier: Snyk_1
                  spec:
                    mode: orchestration
                    config: oss
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
                    privileged: true
                    auth:
                      access_token: <+secrets.getValue("account.snyk_access_token")>
                    tool:
                      ingest_tool_severity: true
